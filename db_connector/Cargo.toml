[package]
name = "db_connector"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.40"

diesel = { version = "2.3.13", features = ["postgres", "uuid", "network-address", "chrono"] }
diesel-async = { version = "0.7.4", default-features = false, features = ["postgres", "deadpool"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
dotenvy = "0.15.7"

ipnetwork = "0.21.1"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
# `tokio` is required for `tokio::task::spawn_blocking` in `run_migrations`.
# The `rt` feature enables `spawn_blocking`; nothing else is needed because
# the migration work is fully synchronous inside the blocking thread.
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1.16.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
