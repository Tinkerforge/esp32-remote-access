[package]
name = "warp_emu"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
boringtun = "0.7.1"
bs58 = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
ipnetwork = { version = "0.21.1", features = ["serde"] }
log = "0.4.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
simplelog = "0.12.2"
smoltcp = { version = "0.12.0", default-features = false, features = ["std", "proto-ipv6"] }
tokio = { version = "1.54.1", features = ["full"] }
